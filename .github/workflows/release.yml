# Tag-driven release: pushing `vX.Y.Z` verifies the tag against Cargo.toml, runs the
# test suite, publishes to crates.io through trusted publishing, and creates a GitHub
# release whose notes are the matching CHANGELOG.md section (extracted with a
# small Python step; awk escaping proved fragile).
# If the version is already on crates.io (for example after a manual first publish),
# the publish job is skipped and only the GitHub release is created.
# One-time setup is described in docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag matches Cargo.toml
        id: version
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          crate_name="$(echo "$metadata" | jq -r '.packages[0].name')"
          crate_version="$(echo "$metadata" | jq -r '.packages[0].version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "::error::Cargo.toml version $crate_version does not match tag $tag_version"
            exit 1
          fi
          echo "name=$crate_name" >> "$GITHUB_OUTPUT"
          echo "version=$crate_version" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already on crates.io
        id: registry
        env:
          CRATE_NAME: ${{ steps.version.outputs.name }}
          CRATE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -A "$CRATE_NAME release workflow (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VERSION}")"
          case "$status" in
            200)
              echo "Version $CRATE_VERSION is already on crates.io; the publish job will be skipped."
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected crates.io response: HTTP $status"
              exit 1
              ;;
          esac
      - run: cargo test --all-features
      - if: steps.registry.outputs.published == 'false'
        run: cargo publish --dry-run

  publish:
    name: Publish to crates.io
    needs: verify
    if: needs.verify.outputs.published == 'false'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub release
    needs: [verify, publish]
    if: always() && needs.verify.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract the changelog section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          version = os.environ["TAG"].removeprefix("v")
          notes, grab = [], False
          for line in open("CHANGELOG.md", encoding="utf-8").read().splitlines():
              if line.startswith("## "):
                  if grab:
                      break
                  grab = line.startswith("## [" + version + "]")
                  continue
              if grab:
                  notes.append(line)
          text = chr(10).join(notes).strip()
          if not text:
              text = "No CHANGELOG.md section found for " + version + "."
          open("release-notes.md", "w", encoding="utf-8").write(text + chr(10))
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
