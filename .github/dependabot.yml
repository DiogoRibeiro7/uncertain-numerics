version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # This action is referenced by moving refs (`@stable`, `@master`) and the MSRV
      # job passes the version as an input, so there is nothing for Dependabot to bump.
      - dependency-name: dtolnay/rust-toolchain
