version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # `dtolnay/rust-toolchain@1.85` pins the MSRV toolchain, and `@stable` is a
      # moving ref. Neither is an action version, so Dependabot must not bump them.
      - dependency-name: dtolnay/rust-toolchain
