name: Feature request
description: Propose a new method, kernel, measure, policy, or API change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, or what is awkward?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Sketch the API or algorithm you have in mind.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Mathematical contract
      description: >
        This project only adds numerical methods whose statistical and numerical
        assumptions can be stated and tested. Which formulas, assumptions and
        validation strategy (analytic reference, calibration study, ...) apply?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
