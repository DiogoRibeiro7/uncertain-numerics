# cargo-deny configuration.
# Run locally with `cargo install cargo-deny && cargo deny check`.
# Reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Every license in the current dependency tree is one of these. Extend the list
# deliberately when a new dependency needs it, and record why in the PR.
allow = [
    "MIT",
    "Apache-2.0",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
